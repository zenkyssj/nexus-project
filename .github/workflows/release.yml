name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ── 1. Leer versión y verificar si el release ya existe ──────────────────────
  check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}

    steps:
      - uses: actions/checkout@v4

      - name: Read version from .version_config.yml
        id: read
        run: |
          VERSION=$(grep 'project-version:' .version_config.yml | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Version from config: $VERSION"

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.read.outputs.version }}"

          # Busca el release en la API de GitHub
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$VERSION")

          echo "GitHub API status for release $VERSION: $STATUS"

          if [ "$STATUS" = "200" ]; then
            echo "⏭️  Release $VERSION already exists — skipping."
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "✅ Release $VERSION not found — proceeding."
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

  # ── 2. Build (solo si should_release=true) ───────────────────────────────────
  build:
    name: Build ${{ matrix.rid }}
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            artifact: nexus
          - os: windows-latest
            rid: win-x64
            artifact: nexus.exe
          - os: macos-latest
            rid: osx-x64
            artifact: nexus

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish single-file binary
        run: >
          dotnet publish src/Nexus.Cli/Nexus.Cli.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -o ./dist/${{ matrix.rid }}

      - name: Rename artifact
        shell: bash
        run: |
          mv ./dist/${{ matrix.rid }}/${{ matrix.artifact }} \
             ./dist/nexus-${{ matrix.rid }}${{ matrix.rid == 'win-x64' && '.exe' || '' }}

      - name: Bundle Python agent
        shell: bash
        run: |
          cp agent/requirements.txt agent/src/requirements.txt
          tar -czf ./dist/nexus-agent.tar.gz -C agent/src nexus_agent requirements.txt
          rm agent/src/requirements.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-${{ matrix.rid }}
          path: |
            ./dist/nexus-${{ matrix.rid }}*
            ./dist/nexus-agent.tar.gz

  # ── 3. Release (solo si build terminó bien) ───────────────────────────────────
  release:
    name: Create release
    needs: [check, build]
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.version }}
          name: ${{ needs.check.outputs.version }}
          files: ./artifacts/*
          body: |
            ## Installation

            ### Linux / macOS
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ needs.check.outputs.version }}/nexus-linux-x64 -o nexus
            chmod +x nexus
            sudo mv nexus /usr/local/bin/nexus
            nexus init
            ```

            ### Windows
            Download `nexus-win-x64.exe`, rename to `nexus.exe` and add to your PATH.

            No .NET installation required.